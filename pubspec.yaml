name: bible_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.1+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.0
  path: ^1.8.0
  
  # Drift (SQLite cross-platform)
  drift: ^2.31.0

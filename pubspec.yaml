name: bible_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.1.1+3

environment:
  sdk: ">=3.8.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  share_plus: ^11.0.0
  flutter_local_notifications: ^19.3.0
  flutter_timezone: ^4.1.1
  timezone: ^0.10.1
  permission_handler: ^12.0.1
  android_intent_plus: ^5.3.0
  package_info_plus: ^8.3.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  diacritic: ^0.1.3
  build_runner: any
  isar_generator: any
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0



flutter_icons:
  android: true
  ios: true
  image_path: "assets/MyOwnBible_logo_trans.png"


flutter:
  assets:
    - assets/bible.json
    - assets/MyOwnBible_logo_trans.png
  uses-material-design: true